name: protocol

on:
  push:
    branches: [main, feat/demo-workflow-example]
    paths:
      - 'packages/**'
      - '.github/workflows/protocol.yml'
  pull_request:
    branches: [main, feat/demo-workflow-example]
    paths:
      - 'packages/**'
      - '.github/workflows/protocol.yml'

concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: harness-protocol conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install harness-protocol (editable, with test extras)
        run: python -m pip install -e "packages/harness-protocol-py[test]"

      - name: Run conformance test suite
        run: python -m pytest packages/harness-protocol-py/tests -q

      - name: Run conformance CLI (the Phase 2A milestone gate)
        run: python -m harness_protocol.conform
