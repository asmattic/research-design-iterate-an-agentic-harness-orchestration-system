name: protocol

on:
  push:
    branches: [main, feat/demo-workflow-example]
    paths:
      - 'packages/**'
      - '.github/workflows/protocol.yml'
  pull_request:
    branches: [main, feat/demo-workflow-example]
    paths:
      - 'packages/**'
      - '.github/workflows/protocol.yml'

concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: harness-protocol conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install harness-protocol (editable, with test extras)
        run: python -m pip install -e "packages/harness-protocol-py[test]"

      - name: Run conformance test suite
        run: python -m pytest packages/harness-protocol-py/tests -q

      - name: Run conformance CLI (the Phase 2A milestone gate)
        run: python -m harness_protocol.conform

      - name: Install harness-reference (editable, with test extras)
        run: python -m pip install -e "packages/harness-reference[test]"

      - name: Run harness-reference suite (Phase 2A contract + strict-xfail Phase 2B behavior)
        run: python -m pytest packages/harness-reference/tests -q -rX

      - name: Install harness-evals (editable, with test extras)
        run: python -m pip install -e "packages/harness-evals[test]"

      - name: Run harness-evals suite (Phase 2A contract + strict-xfail Phase 2D behavior)
        run: python -m pytest packages/harness-evals/tests -q -rX

      - name: Install harness-verifier and harness-os (editable, with test + mcp extras)
        run: |
          python -m pip install -e "packages/harness-verifier[test,mcp]"
          python -m pip install -e "packages/harness-os[test]"

      - name: Run harness-verifier suite
        run: python -m pytest packages/harness-verifier/tests -q

      - name: Run harness-os suite (incl. the recorded-campaign integration test)
        run: python -m pytest packages/harness-os/tests -q

      - name: Run adapter conformance suite
        run: python -m pytest adapters/claude_code/tests -q

      - name: Run combined suites in one invocation (cross-suite collision guard)
        run: python -m pytest packages/harness-protocol-py/tests packages/harness-reference/tests packages/harness-evals/tests packages/harness-verifier/tests packages/harness-os/tests adapters/claude_code/tests -q

      - name: CLI smokes (eval dry-run + verifier list)
        run: |
          harness eval list
          harness eval run --benchmark smoke --config packages/harness-evals/pyproject.toml --output /tmp/evals-smoke --dry-run
          harness-verify list

      - name: Phase 2D milestone gate — live rental benchmark produces a report
        run: |
          harness eval run --benchmark rental-synthetic --config packages/harness-evals/configs/rental-default.json --output /tmp/rental-report
          test -f /tmp/rental-report/report.md
          grep -q "^# Campaign rental-synthetic report" /tmp/rental-report/report.md
          grep -q "^## Calibration" /tmp/rental-report/report.md
