[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-evals"
version = "0.2.0"
description = "Eval harness skeleton: CLI, benchmark/scorer registries, dummy scorer"
requires-python = ">=3.10"
dependencies = ["harness-protocol>=0.2,<0.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
harness = "harness_evals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_evals"]

[tool.hatch.build.targets.wheel.force-include]
"benchmarks" = "harness_evals/_assets/benchmarks"
"fixtures" = "harness_evals/_assets/fixtures"
