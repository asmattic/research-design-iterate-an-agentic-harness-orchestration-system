[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-reference"
version = "0.2.0"
description = "Reference scaffolding for the harness orchestration protocol: campaign templates and executable modules"
requires-python = ">=3.10"
dependencies = ["harness-protocol>=0.2,<0.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/harness_reference"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "harness_reference/_templates"
